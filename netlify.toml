[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to the live backend server
[[redirects]]
  from = "/api/*"
  to = "https://eagle-eye-backend-tld9.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback Routing for React Router / Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
